<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager!!!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 15px;
        }

        .stats {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stats-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }

        .progress-bar {
            background: #ddd;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: #667eea;
            height: 100%;
            transition: width 0.3s ease;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
        }

        #taskList {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            padding: 8px 15px;
            background: #ef4444;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .clear-completed {
            width: 100%;
            margin-top: 15px;
            background: transparent;
            color: #666;
            font-size: 14px;
        }

        .clear-completed:hover {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .instructions {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .instructions ul {
            list-style: none;
            color: #666;
        }

        .instructions li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My Task Manager ✅!!!!!</h1>

        <!-- Stats -->
        <div class="stats">
            <div class="stats-text">
                <span><strong id="completedCount">0</strong> of <strong id="totalCount">0</strong> tasks completed</span>
                <span style="color: #667eea; font-weight: bold;">📊 <span id="percentage">0</span>%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task..." />
            <button onclick="addTask()">➕ Add</button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Clear Completed Button -->
        <button class="clear-completed" id="clearBtn" style="display: none;" onclick="clearCompleted()">
            🧹 Clear completed tasks
        </button>

        <!-- Instructions -->
        <div class="instructions">
            <h3>📌 How to use:</h3>
            <ul>
                <li>⌨️ Type a task and press Enter or click Add</li>
                <li>☑️ Check the box to mark tasks as complete</li>
                <li>🗑️ Click Delete to remove tasks</li>
                <li>📊 Track your progress with the bar above</li>
            </ul>
        </div>
    </div>

    <script>
        let tasks = [];

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const clearBtn = document.getElementById('clearBtn');

            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">📭 No tasks yet. Add one above to get started!</div>';
                clearBtn.style.display = 'none';
            } else {
                taskList.innerHTML = tasks.map((task, index) => `
                    <li class="task-item">
                        <input type="checkbox" class="task-checkbox"
                               ${task.completed ? 'checked' : ''}
                               onchange="toggleTask(${index})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                        <button class="delete-btn" onclick="deleteTask(${index})">🗑️ Delete</button>
                    </li>
                `).join('');
            }

            updateStats();
        }

        function updateStats() {
            const totalCount = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const percentage = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('percentage').textContent = percentage;
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (text) {
                tasks.push({ text, completed: false });
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            renderTasks();
        }

        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        renderTasks();
    </script>
</body>
</html>
